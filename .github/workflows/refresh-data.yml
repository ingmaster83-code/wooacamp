name: Weekly Camp Data Refresh

on:
  schedule:
    - cron: '30 15 * * 0'  # 매주 일요일 00:30 KST (전날 15:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh camp data
        env:
          GOCAMPING_API_KEY: ${{ secrets.GOCAMPING_API_KEY }}
        run: python scripts/fetch_camps.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _rawdata/camps.json
          if ! git diff --cached --quiet; then
            git commit -m "Weekly camp data refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No data changes"
          fi
